[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fastq-classifier"
version = "0.1.0"
description = "Reference-free FASTQ feature extraction and classification components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "scikit-learn>=1.8",
    "scipy>=1.11",
]

[project.scripts]
fastq-classifier = "fastq_classifier.cli:main"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.31",
    "numpydoc>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastq_classifier"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "ISC001",
    "S101",
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true

[tool.ruff.lint.isort]
known-first-party = ["fastq_classifier"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 6

[tool.numpydoc_validation]
checks = [
    "all",
    "GL01",
    "ES01",
    "SA01",
    "EX01",
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
