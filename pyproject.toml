[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastq-classifier"
version = "0.1.0"
description = "Classify Anopheles taxonomic groups from paired-end FASTQ reads."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scikit-learn>=1.8,<2"]

[project.scripts]
fastq-classifier = "fastq_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fastq_classifier = ["py.typed"]
